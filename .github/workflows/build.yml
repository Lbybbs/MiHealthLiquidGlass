# Build the LSPosed module on GitHub-hosted runners and upload the APK.
#
# No secrets / no tokens needed: the runner has a preinstalled Android SDK and
# we only fetch public artifacts from Maven Central + JitPack.
#
# Trigger by pushing a branch (or manually via Actions -> "Build module").
name: Build module APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install missing SDK packages (platform 35 + build-tools 35.0.0)
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiHealthLiquidGlass
          path: app/build/outputs/apk/release/*.apk
